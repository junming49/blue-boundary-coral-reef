<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星问｜带证据链的天文导览伙伴</title>
<style>
:root{--sky:#090d20;--panel:#111832;--line:#30385b;--ink:#f3f0e9;--muted:#b3b5ca;--violet:#adb5ff;--gold:#f3d58f;--blue:#7fdbe0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 40% -10%,#323262 0,transparent 45%),var(--sky);color:var(--ink);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:auto;padding:0 22px}.top{height:64px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff1b;color:var(--muted);font-size:12px}.brand{color:var(--violet);font-weight:700;letter-spacing:.16em;text-decoration:none}.back{color:var(--muted);text-decoration:none}.hero{padding:30px 0 18px}.k{font:11px ui-monospace,monospace;letter-spacing:.17em;color:var(--blue)}h1{font-size:clamp(31px,4vw,49px);line-height:1.1;margin:8px 0}.hero p{max-width:760px;color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:12px 0 38px}.panel{border:1px solid var(--line);border-radius:15px;background:#111832dd;overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;border-bottom:1px solid var(--line);font-size:12px}.label{color:var(--blue);font:10px ui-monospace,monospace}.sky{position:relative;min-height:350px;background:radial-gradient(circle at 32% 44%,#6464a8 0,#272c67 16%,#171e49 42%,#0b1231 75%);overflow:hidden}.sky:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.7px),radial-gradient(#dce3ff 1px,transparent 1.8px);background-size:63px 57px,107px 89px;background-position:11px 20px,43px 4px;opacity:.5}.nebula{position:absolute;width:220px;height:130px;border-radius:50%;left:25%;top:28%;background:radial-gradient(ellipse,#efbfff5c,#83a2f02b 40%,transparent 72%);filter:blur(9px)}.node{position:absolute;border:0;background:transparent;color:#fff;cursor:pointer;padding:10px;text-align:center;text-shadow:0 0 13px #a9bdff;font-size:12px}.node b{display:block;font-size:24px;color:var(--gold)}.node:hover,.node:focus-visible{outline:1px solid var(--gold);border-radius:10px}.n1{left:14%;top:20%}.n2{left:49%;top:11%}.n3{right:9%;top:42%}.n4{left:39%;bottom:10%}.map-foot{padding:12px 16px;color:var(--muted);font-size:10px}.answer{padding:17px}.ask{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}.q{border:1px solid var(--line);border-radius:99px;padding:8px 11px;background:#171f3b;color:var(--ink);font-size:11px;cursor:pointer}.q:hover,.q[aria-pressed=true]{border-color:var(--violet);color:#e4e5ff;background:#252950}.claim{font-size:19px;line-height:1.4;margin:12px 0}.why{font-size:12px;color:var(--muted);margin:0 0 12px}.evidence{border-left:2px solid var(--gold);padding:9px 12px;background:#171c35;border-radius:0 8px 8px 0;font-size:11px;color:#d5d3de}.evidence strong{color:var(--gold)}.evidence a{color:var(--blue)}.quiz{padding:15px 17px;border-top:1px solid var(--line)}.quiz h2{font-size:14px;margin:0 0 8px}.quiz p{font-size:12px;margin:0 0 10px;color:#d4d7e8}.opts{display:grid;gap:7px}.opt{border:1px solid var(--line);background:#101831;color:var(--ink);text-align:left;border-radius:8px;padding:8px 10px;font-size:11px;cursor:pointer}.opt:hover{border-color:var(--blue)}.feedback{min-height:22px;color:var(--gold);font-size:11px;margin-top:8px}.note{font-size:10px;color:#989fb8;margin:0;padding:0 17px 15px}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media(max-width:780px){.layout{grid-template-columns:1fr}.sky{min-height:280px}.shell{padding:0 14px}}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="index.html">FIELD / 03</a><a class="back" href="index.html">← 返回作品集</a></header>
<section class="hero"><div class="k">EVIDENCE-BASED SCIENCE LEARNING</div><h1>星问：带证据链的天文导览伙伴</h1><p>点选一个天体，或从常见问题开始。每条解释都带来源和适用范围；这里运行的是离线规则检索演示，不调用在线大模型。</p></section>
<main class="layout"><section class="panel"><div class="panel-head"><b>星图 · 点选一个观察对象</b><span class="label">SKY / DEMO</span></div><div class="sky"><div class="nebula"></div><button class="node n1" data-id="nebula"><b>✧</b>星云</button><button class="node n2" data-id="sun"><b>☼</b>太阳</button><button class="node n3" data-id="massive"><b>✦</b>大质量恒星</button><button class="node n4" data-id="remnant"><b>○</b>恒星遗迹</button></div><div class="map-foot">示意星图，不代表实际星空方位。选择节点查看与它关联的知识条目。</div></section>
<section class="panel"><div class="panel-head"><b>证据导览台</b><span class="label">CLAIM → SOURCE</span></div><div class="answer"><div class="label">当前条目</div><div class="ask" id="questions"></div><div class="claim" id="claim"></div><p class="why" id="why"></p><div class="evidence" id="evidence"></div></div><div class="quiz"><h2>一分钟复核</h2><p id="quizq"></p><div class="opts" id="opts"></div><div class="feedback" id="feedback" aria-live="polite"></div></div><p class="note">内容摘要依据 NASA 面向公众的恒星演化资料编写。正式申报前由团队逐条复核科学表述、补齐引文页码和教材适配说明。</p></section></main></div>
<script>
const src='https://science.nasa.gov/mission/webb/star-lifecycle/';const data={
nebula:{title:'恒星在气体与尘埃云中诞生。',why:'引力使星云物质逐渐聚集。星云是恒星演化叙事的起点；本条只概述形成路径。',source:'NASA Science · Star Lifecycle（恒星生命周期）',url:src,q:'恒星演化从哪里开始？',opts:['星云中的气体与尘埃','白矮星','行星表面'],correct:0,explain:'NASA 资料将恒星的形成放在由气体和尘埃构成的星云中。'},
sun:{title:'恒星在主序阶段稳定地进行氢聚变。',why:'恒星质量会影响它燃烧燃料的速度与生命周期；“所有恒星走同一条路”是不准确的简化。',source:'NASA Science · Star Lifecycle（恒星生命周期）',url:src,q:'哪项会显著影响恒星的生命周期？',opts:['恒星质量','观测者所在城市','恒星颜色名称'],correct:0,explain:'NASA 资料指出，恒星质量决定其燃料消耗速率，并影响演化路径。'},
massive:{title:'大质量恒星的晚期可能以超新星事件结束。',why:'恒星晚期结局取决于质量。该交互把不同质量的恒星分开展示，避免将一种结局推广给所有恒星。',source:'NASA Science · Star Lifecycle（恒星生命周期）',url:src,q:'大质量恒星可能经历哪种晚期事件？',opts:['超新星','木星凌日','月相变化'],correct:0,explain:'NASA 资料描述了大质量恒星在晚期发生核心坍缩并形成超新星的路径。'},
remnant:{title:'太阳不会变成黑洞；它的结局与大质量恒星不同。',why:'质量差异会带来不同演化路径。这里的“恒星遗迹”用于对照理解，不是对具体天体的观测图。',source:'NASA Science · Big Idea 3.3（恒星生命周期教学资料）',url:'https://science.nasa.gov/big-idea-3-3-intermediate-level-guiding-question/',q:'太阳最终会变成黑洞吗？',opts:['会，所有恒星都会','不会，它的质量不足以形成黑洞','目前已观测到太阳变成黑洞'],correct:1,explain:'NASA 教学资料说明，太阳会演化为白矮星，不会变成黑洞。'}};
let current='sun';function show(id){current=id;let d=data[id];document.getElementById('claim').textContent=d.title;document.getElementById('why').textContent=d.why;document.getElementById('evidence').innerHTML='<strong>证据来源：</strong>'+d.source+'<br><a target="_blank" rel="noopener" href="'+d.url+'">打开来源页面 ↗</a>';document.getElementById('quizq').textContent=d.q;document.getElementById('feedback').textContent='';document.getElementById('opts').innerHTML=d.opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+String.fromCharCode(65+i)+' · '+o+'</button>').join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{let ok=+b.dataset.i===d.correct;document.getElementById('feedback').textContent=ok?'回答正确。'+d.explain:'再想一想：'+d.explain});document.querySelectorAll('.node').forEach(n=>n.setAttribute('aria-pressed',n.dataset.id===id));}
document.querySelectorAll('.node').forEach(n=>n.onclick=()=>show(n.dataset.id));
document.getElementById('questions').innerHTML=Object.keys(data).map((k,i)=>'<button class="q" aria-pressed="'+(k==='sun')+'" data-id="'+k+'">'+['星云','太阳','大质量恒星','恒星遗迹'][i]+'</button>').join('');document.querySelectorAll('.q').forEach(b=>b.onclick=()=>{document.querySelectorAll('.q').forEach(q=>q.setAttribute('aria-pressed',q===b));show(b.dataset.id)});show(current);
</script></body></html>
