<style>

order-radius:50%;background:#fff;box-shadow:0 0 0 7px #ffffff25,0 0 25px #fff;z-index:2}.a{left:17%;top:60%}.b{left:47%;top:51%;background:var(--red)}.c{right:14%;top:27%;background:var(--ice)}.maplabel{position:absolute;z-index:3;font-size:10px;padding:5px 8px;border-radius:5px;background:#121d24d9;color:#e8e4d8}.l1{left:8%;top:72%}.l2{left:39%;top:43%}.l3{right:6%;top:17%}.mapfoot{padding:12px 16px;color:var(--muted);font-size:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.stat{padding:12px 14px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{font-size:9px;display:block;color:var(--muted)}.stat b{font:22px Georgia,serif;color:var(--amber)}.storybody{padding:18px}.step{font:10px ui-monospace,monospace;letter-spacing:.12em;color:var(--ice)}.storytitle{font-size:20px;margin:10px 0}.narrative{color:#c7d0cc;font-size:12px;min-height:68px}.choices{display:grid;gap:8px;margin:12px 0}.choice{background:#202f37;color:var(--ink);border:1px solid #59666b;border-radius:9px;text-align:left;padding:10px 12px;font-size:11px;cursor:pointer}.choice:hover{border-color:var(--amber)}.facts{padding:12px;border-left:2px solid var(--ice);background:#1d2d33;border-radius:0 8px 8px 0;font-size:10px;color:var(--muted);margin-top:13px}.facts a{color:var(--ice)}.footnote{font-size:10px;color:#98a6a5;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:1px solid #59666b;border-radius:8px;padding:8px 10px;background:transparent;color:var(--ink);font-size:10px;cursor:pointer}.btn:hover{border-color:var(--amber)}button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}

<section class="hero"><div class="k">CHINA STORY · INTERACTIVE WEB NARRATIVE</div><h1>北斗·归途：一束信号，走出风暴</h1><p>暴雨中的山地村道通讯中断，青年志愿队需要协同判断。你将阅读一段虚构的救援故事，选择沟通与路线确认方式，并看到每个决定的代价。</p></section>
<main class="layout"><section class="map"><div class="maphead"><b>雾岭 · 示意地形图</b><span class="step">FICTIONAL SCENARIO</span></div><div class="mapstage"><div class="mount"></div><div class="mount two"></div><div class="routeLine" id="line"></div><i class="point a"></i><i class="point b"></i><i class="point c"></i><span class="maplabel l1">临时集合点</span><span class="maplabel l2" id="mid">山口信号盲区</span><span class="maplabel l3">村卫生站</span></div><div class="stats"><div class="stat"><span>队伍余量（叙事单位）</span><b id="resource">6</b></div><div class="stat"><span>确认信息（片段）</span><b id="evidenceCount">0</b></div><div class="stat"><span>当前分支</span><b id="branch">A</b></div></div><div class="mapfoot">路径为故事示意，无真实坐标、定位能力或应急指挥功能。</div></section>
<section class="story"><div class="storyhead"><b>互动叙事 · 你的选择会留下记录</b><span class="step" id="step">第 1 / 3 幕</span></div><div class="storybody"><div class="step" id="chapter">01 / SIGNAL LOST</div><h2 class="storytitle" id="title"></h2><div class="narrative" id="text"></div><div class="choices" id="choices"></div><div class="facts" id="fact"></div><div class="actions"><button class="btn" id="restart">重新体验</button><button class="btn" id="export">导出选择回放</button></div><p class="footnote" id="status" aria-live="polite"></p></div></section></main></div>
<script>
const scenes=[
{chapter:'01 / SIGNAL LOST',title:'山口之外的最后一格电',text:'队员林舟在村口与小队失去联系。地图上两条路径都被暴雨冲断一段，队伍需要确认集合点，避免盲目深入。',fact:'北斗系统是中国自主建设运行的全球卫星导航系统。导航定位、授时等信息服务由系统与终端协同实现；本故事不模拟真实救援链路。',choices:[['先回到约定集合点，按既定联络计划确认队员','耗时增加，队伍余量 -1；获得可靠集合点记录',-1,1,'A'],['沿熟悉的山路追赶，边走边呼叫','暂时接近目标，但没有确认山路是否通行',-2,0,'B']]},
{chapter:'02 / COORDINATION',title:'一条定位信息，不能替代协同',text:'山口重新收到一条位置回报。小队要判断是否立刻前进，还是先核对信息来源、时间和道路状态。',fact:'公开资料列出北斗提供的服务类型；实际能力取决于卫星系统、终端、通信条件和使用场景。单个导航信号不能代替现场组织、路线核验和专业救援。',choices:[['核对信息时间，并向村卫生站确认道路情况','多花一点时间，形成双重确认',-1,1,'C'],['把位置点直接当作安全路线','快速行动，但留下未经验证的判断',-1,0,'D']]},
{chapter:'03 / RETURN',title:'把队伍带回有光的地方',text:'天色变暗，临时避雨点已联系上村干部。最后一次选择将决定故事如何收束。',fact:'科技叙事需要同时呈现技术边界与人的协作。本项目中的角色、地形和事件均为原创虚构，不代表任何真实救援案例。',choices:[['在安全位置等待地面人员确认，再按统一安排行动','结束在“协同确认”的分支',0,1,'E'],['继续独自寻找队员','故事以信息断链告终，提示风险',-1,0,'F']]}
];let stage=0,res=6,ev=0,records=[];
function render(){let s=scenes[stage];document.getElementById('chapter').textContent=s.chapter;document.getElementById('title').textContent=s.title;document.getElementById('text').textContent=s.text;document.getElementById('fact').innerHTML='<b>事实卡 / </b>'+s.fact+'<br><a target="_blank" rel="noopener" href="https://www.csno-tarc.cn/status/introduction">打开中国卫星导航系统管理办公室测试评估研究中心介绍 ↗</a>';document.getElementById('step').textContent='第 '+(stage+1)+' / 3 幕';document.getElementById('choices').innerHTML=s.choices.map((c,i)=>'<button class="choice" data-i="'+i+'">'+c[0]+'<br><span style="color:#aabbb8">'+c[1]+'</span></button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));document.getElementById('resource').textContent=res;document.getElementById('evidenceCount').textContent=ev;document.getElementById('branch').textContent=records.length?records[records.length-1].branch:'A';document.getElementById('mid').textContent=res<4?'临时避雨点':'山口信号盲区';document.getElementById('line').style.width=(55+ev*7)+'%';}
function choose(i){let c=scenes[stage].choices[i];res=Math.max(0,res+c[2]);ev+=c[3];records.push({chapter:stage+1,choice:c[0],branch:c[4],resources:res,confirmedInformation:ev});if(stage<2){stage++;render();document.getElementById('status').textContent='分支已记录，故事继续。'}else{document.getElementById('choices').innerHTML='<div class="facts"><b>结局：</b>'+(c[4]==='E'?'队伍停在安全位置，完成双向确认。':'行动受阻，留下复盘线索：位置消息不等于道路安全。')+'<br><br>本体验的数值和线路只服务于故事分支。</div>';document.getElementById('status').textContent='三幕体验完成。可以重新体验另一条分支。';}}
document.getElementById('restart').onclick=()=>{stage=0;res=6;ev=0;records=[];render();document.getElementById('status').textContent='新一轮已开始。'};document.getElementById('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({title:'北斗·归途',fictional:true,choices:records},null,2)],{type:'application/json'}));a.download='beidou-story-playback.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
