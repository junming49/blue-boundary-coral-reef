<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同频舱｜多模态无障碍空间导航</title>
<style>
:root{--bg:#101b24;--card:#172832;--line:#354e59;--ink:#edf3ef;--muted:#a2b7b5;--teal:#77dfc4;--lime:#c8e78b;--warn:#edc76c;--scale:1}
*{box-sizing:border-box}body{margin:0;background:#101b24;color:var(--ink);font:calc(15px * var(--scale))/1.5 "Segoe UI","Microsoft YaHei",sans-serif;transition:background .2s}body.hi{--bg:#000;--card:#101010;--line:#aaa;--ink:#fff;--muted:#eee;--teal:#7ffff0;--lime:#efff68;background:#000}body.reduce *{transition:none!important;animation:none!important}.shell{max-width:1200px;margin:auto;padding:0 22px}.top{height:62px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.logo{color:var(--teal);font-weight:700;letter-spacing:.14em;text-decoration:none}.back{color:var(--muted);text-decoration:none}.hero{padding:28px 0 18px}.k{font:11px ui-monospace,monospace;letter-spacing:.16em;color:var(--teal)}h1{font-size:clamp(30px,4vw,48px);line-height:1.1;margin:8px 0}.hero p{color:var(--muted);max-width:750px;margin:0}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding:12px 0 38px}.card{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}.map-head{display:flex;justify-content:space-between;padding:14px 17px;border-bottom:1px solid var(--line);font-size:12px}.badge{color:var(--teal);font:10px ui-monospace,monospace}.map{padding:18px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-height:350px;background:linear-gradient(135deg,#1b3540,#152730)}.cell{aspect-ratio:1.3;border:1px solid #42606a;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:10px;color:#bfd0ce;background:#18303a;position:relative}.cell span{font-size:8px;color:#90aaa8}.cell.block{background:repeating-linear-gradient(135deg,#482f35,#482f35 5px,#5a3a3c 5px,#5a3a3c 9px);color:#ffe0d2;border-color:#bc807a}.cell.stair{background:#403d31;border-color:#a89b68}.cell.path{box-shadow:inset 0 0 0 2px var(--lime);color:#f5ffd5}.cell.start{background:#15594f;border-color:var(--teal)}.cell.goal{background:#604638;border-color:#efbb7d}.cell.here:after{content:"●";position:absolute;color:#fff;font-size:24px;text-shadow:0 0 12px var(--teal)}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 17px 15px;font-size:10px;color:var(--muted)}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--teal)}.controls{padding:18px}.controls h2{font-size:15px;margin:0 0 8px}.muted{color:var(--muted);font-size:11px}.dest{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}.chip,.btn{border:1px solid var(--line);border-radius:9px;background:#10212a;color:var(--ink);padding:8px 10px;font-size:11px}.chip[aria-pressed=true]{border-color:var(--teal);background:#20443e;color:#dffff3}.btn{cursor:pointer}.btn:hover,.chip:hover{border-color:var(--teal)}.route{background:#0f2028;border-radius:10px;padding:12px;margin:12px 0;color:#b7d2cc;font-size:11px;min-height:58px}.route b{color:var(--lime)}.command{display:flex;gap:6px;margin:10px 0}.command input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:#0c1a22;color:var(--ink);padding:9px;font:inherit;font-size:11px}.dpad{display:grid;grid-template-columns:repeat(3,42px);gap:5px;justify-content:center;margin:10px auto}.dpad button{height:38px}.opts{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.log{border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:10px;max-height:75px;overflow:auto}.note{font-size:10px;color:#96aaa7;margin:10px 0 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}.live{min-height:18px;color:var(--warn);font-size:11px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.map{min-height:0}.cell{font-size:8px}.shell{padding:0 14px}}
</style></head><body><div class="shell">
<header class="top"><a class="logo" href="index.html">FIELD / 02</a><a class="back" href="index.html">← 返回作品集</a></header>
<section class="hero"><div class="k">ACCESSIBLE WEB APPLICATION · NAVIGATION</div><h1>同频舱：多模态无障碍空间导航</h1><p>同一条路线，可以用不同方式操作。试试键盘、屏幕方向键或文字指令，再根据自己的偏好调整显示方式。</p></section>
<main class="grid"><section class="card"><div class="map-head"><b>空间图 · 实验楼二层（虚构布局）</b><span class="badge">LOCAL DEMO</span></div><div class="map" id="map" role="grid" aria-label="室内空间网格"></div><div class="legend"><span><i class="dot"></i>当前位置</span><span>🟩 已规划路径</span><span>▧ 不可通行</span><span>▧ 楼梯</span></div></section>
<aside class="card controls"><h2>选择目的地</h2><div class="muted">路线会考虑封闭区域与无障碍偏好。示例地图不对应真实建筑。</div><div class="dest" id="dest"></div>
<div class="route" id="route" aria-live="polite"></div><button class="btn" id="next">沿路线前进一步</button>
<h2 style="margin-top:18px">也可以直接操作</h2><div class="dpad" aria-label="屏幕方向键"><span></span><button class="btn" data-move="0,-1" aria-label="向上">↑</button><span></span><button class="btn" data-move="-1,0" aria-label="向左">←</button><button class="btn" data-move="0,0" aria-label="当前位置">●</button><button class="btn" data-move="1,0" aria-label="向右">→</button><span></span><button class="btn" data-move="0,1" aria-label="向下">↓</button><span></span></div>
<div class="command"><input id="cmd" aria-label="文字指令" placeholder="输入：去阅读区 / 去服务台"><button class="btn" id="send">执行</button></div>
<div class="opts"><button class="btn" id="contrast" aria-pressed="false">高对比</button><button class="btn" id="large" aria-pressed="false">大字</button><button class="btn" id="motion" aria-pressed="false">减少动效</button><button class="btn" id="accessible" aria-pressed="true">避开楼梯</button><button class="btn" id="export">导出路线</button><button class="btn" id="reset">重置</button></div>
<div class="live" id="live" aria-live="polite"></div><div class="log" id="log">路线记录：等待选择目的地。</div><p class="note">原型用网格与广度优先搜索规划示例路线，不连接真实地图或校园定位。实际部署前需现场测绘、无障碍核验和用户测试。</p></aside></main></div>
<script>
const W=7,H=5,start={x:0,y:2},blocks=new Set(['2,0','2,1','2,2','4,3']),stairs=new Set(['4,1','4,2']);const places=[{n:'服务台',x:6,y:0},{n:'阅读区',x:6,y:4},{n:'电梯',x:0,y:4},{n:'实验室',x:6,y:2}];let pos={...start},goal=places[0],route=[],history=[],accessible=true;
const map=document.getElementById('map'),dest=document.getElementById('dest');
function key(p){return p.x+','+p.y}function valid(p){return p.x>=0&&p.x<W&&p.y>=0&&p.y<H&&!blocks.has(key(p))&&(!accessible||!stairs.has(key(p)))}
function bfs(){let q=[[pos]],seen=new Set([key(pos)]);while(q.length){let path=q.shift(),p=path[path.length-1];if(p.x===goal.x&&p.y===goal.y)return path.slice(1);for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let n={x:p.x+dx,y:p.y+dy};if(valid(n)&&!seen.has(key(n))){seen.add(key(n));q.push([...path,n])}}}return null}
function render(){route=bfs()||[];map.innerHTML='';for(let y=0;y<H;y++)for(let x=0;x<W;x++){let el=document.createElement('div'),p={x,y};el.className='cell';el.setAttribute('role','gridcell');if(blocks.has(key(p))){el.classList.add('block');el.innerHTML='封闭<span>维护中</span>'}else if(stairs.has(key(p))){el.classList.add('stair');el.innerHTML='楼梯<span>stairs</span>'}else{let r=route.findIndex(t=>t.x===x&&t.y===y);if(r>=0)el.classList.add('path');let name=places.find(t=>t.x===x&&t.y===y);if(name){el.classList.add('goal');el.innerHTML=name.n+'<span>目的地</span>'}if(x===start.x&&y===start.y)el.classList.add('start');if(x===pos.x&&y===pos.y)el.classList.add('here');}map.appendChild(el)}
dest.innerHTML=places.map((p,i)=>'<button class="chip" aria-pressed="'+(p===goal)+'" data-i="'+i+'">'+p.n+'</button>').join('');dest.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{goal=places[+b.dataset.i];document.getElementById('live').textContent='目的地已切换为'+goal.n+'。';render()});
document.getElementById('route').innerHTML=route.length?'<b>'+goal.n+'</b> · '+route.length+' 步 · '+route.map((p,i)=>'（'+(i+1)+'）'+(p.x+1)+','+(p.y+1)).join(' → '):'<b>当前设置下没有可达路线</b> · 请换目的地或检查无障碍偏好。';}
function move(dx,dy){if(!dx&&!dy)return;if(route.length&&dx===0&&dy===0){advance();return}let n={x:pos.x+dx,y:pos.y+dy};if(!valid(n)){document.getElementById('live').textContent='前方不可通行，已保持当前位置。';return}pos=n;history.push([pos.x,pos.y]);document.getElementById('live').textContent='已移动到网格 '+(pos.x+1)+','+(pos.y+1)+'。';render()}
function advance(){if(!route.length){document.getElementById('live').textContent='没有可执行路线。';return}pos=route[0];history.push([pos.x,pos.y]);document.getElementById('live').textContent=pos.x===goal.x&&pos.y===goal.y?'已到达'+goal.n+'。':'已沿规划路线前进一步。';document.getElementById('log').textContent='路线记录：'+history.map(p=>'('+ (p[0]+1)+','+(p[1]+1)+')').join(' → ');render()}
document.getElementById('next').onclick=advance;document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(...b.dataset.move.split(',').map(Number)));window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&!['INPUT'].includes(document.activeElement.tagName)){e.preventDefault();let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];move(...m)}});
document.getElementById('send').onclick=()=>{let v=document.getElementById('cmd').value.trim(),p=places.find(x=>v.includes(x.n));if(p){goal=p;document.getElementById('live').textContent='已理解文字指令，目的地设为'+p.n+'。';render()}else document.getElementById('live').textContent='没有识别到地点，请输入服务台、阅读区、电梯或实验室。'};
function pref(id,fn){let b=document.getElementById(id);b.onclick=()=>{let on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);fn(on);try{localStorage.setItem('sync-'+id,on?'1':'0')}catch(e){}};try{if(localStorage.getItem('sync-'+id)==='1')b.click()}catch(e){}}
pref('contrast',v=>document.body.classList.toggle('hi',v));pref('large',v=>document.documentElement.style.setProperty('--scale',v?'1.18':'1'));pref('motion',v=>document.body.classList.toggle('reduce',v));document.getElementById('accessible').onclick=e=>{accessible=!accessible;e.currentTarget.setAttribute('aria-pressed',accessible);e.currentTarget.textContent=accessible?'避开楼梯':'允许楼梯';render()};
document.getElementById('export').onclick=()=>{let o={project:'同频舱',type:'虚构网格路径演示',destination:goal.n,path:route.map(p=>[p.x+1,p.y+1]),manualPositions:history,accessibleAvoidStairs:accessible};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='tongpin-route.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('reset').onclick=()=>{pos={...start};goal=places[0];route=[];history=[];render();document.getElementById('log').textContent='路线记录：已重置。';document.getElementById('live').textContent='已重置导航。'};render();
</script></body></html>
