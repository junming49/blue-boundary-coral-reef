<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08131d">
  <title>数字媒体互动原型</title>
  <style>
    :root{--ink:#08131d;--panel:#102330;--panel2:#142d3b;--line:rgba(215,237,232,.14);--text:#edf5f0;--muted:#9bb0b0;--accent:#8ce0c9;--gold:#f2cf86;--bad:#ff9b7b;--good:#9fe1b2}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 5%,#153449 0,transparent 30%),var(--ink);color:var(--text);font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.55}a{color:var(--accent)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
    .topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:13px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:#08131de8;backdrop-filter:blur(14px);font-size:12px}.brand{color:var(--text);text-decoration:none;letter-spacing:.13em;font-weight:700}.back{color:var(--muted);text-decoration:none}.back:hover{color:var(--accent)}.wrap{max-width:1100px;margin:auto;padding:30px clamp(16px,4vw,34px) 54px}.phead{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:15px 0 27px}.eyebrow{color:var(--accent);font:11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.phead h1{font:clamp(34px,5vw,56px)/1.08 Georgia,"Microsoft YaHei",serif;letter-spacing:-.035em;margin:12px 0}.phead p{max-width:670px;color:#b8c9c5;margin:0;font-size:14px}.indexmark{text-align:right;color:var(--muted);font:12px ui-monospace,monospace;min-width:100px}.indexmark b{display:block;color:var(--accent);font-size:30px;font-weight:400}
    .layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.75fr);gap:15px;align-items:start}.panel{background:linear-gradient(145deg,#112936,#0d1c27);border:1px solid var(--line);border-radius:18px;padding:20px}.panel h2,.panel h3{margin:0 0 9px}.panel h2{font-size:18px}.panel h3{font-size:15px}.small{font-size:12px;color:var(--muted)}.kicker{font:10px ui-monospace,monospace;letter-spacing:.15em;color:var(--accent);text-transform:uppercase}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.spread{display:flex;justify-content:space-between;gap:12px;align-items:center}.btn{border:1px solid #577373;background:#162f3b;color:var(--text);padding:10px 13px;border-radius:11px;font-size:12px;transition:.18s}.btn:hover{border-color:var(--accent);background:#1b4146}.btn.primary{background:var(--accent);border-color:var(--accent);color:#0b2424;font-weight:700}.btn.ghost{background:transparent}.btn.smallbtn{padding:7px 10px}.btn:disabled{opacity:.42;cursor:not-allowed}.pill{font-size:10px;padding:5px 9px;border-radius:999px;background:#ffffff0c;border:1px solid var(--line);color:#bfd0ca}.rule{height:1px;background:var(--line);margin:16px 0}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}.metric{padding:12px;border-radius:12px;background:#091923;border:1px solid var(--line)}.metric label{display:block;color:var(--muted);font-size:10px}.metric strong{font:22px Georgia,serif;color:var(--accent)}.meter{height:4px;background:#ffffff12;border-radius:5px;margin-top:8px;overflow:hidden}.meter i{height:100%;display:block;background:var(--accent);border-radius:5px;transition:width .3s}.scene{position:relative;min-height:245px;overflow:hidden;border-radius:15px;background:linear-gradient(165deg,#244b5a 0,#0f2939 53%,#081825 100%);border:1px solid #9ad8cc28;padding:18px;display:flex;flex-direction:column;justify-content:space-between}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,transparent 35%,#ffffff09 36% 37%,transparent 38%),radial-gradient(ellipse at 25% 100%,#7ac8b22a,transparent 54%);pointer-events:none}.scene>*{position:relative}.scene-tag{font:10px ui-monospace,monospace;letter-spacing:.15em;color:#b7dcd3}.scene-title{font:28px Georgia,serif;max-width:420px}.choice-grid{display:grid;gap:9px;margin-top:14px}.choice{display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left}.choice span:first-child{font-weight:600}.choice small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.choice b{font:15px ui-monospace,monospace;color:var(--accent)}.callout{padding:13px 14px;background:#e6c78312;border:1px solid #e6c78336;border-radius:12px;color:#decfa7;font-size:12px;margin-top:13px}.success{color:var(--good)}.warning{color:var(--bad)}.linkbtn{color:var(--accent);text-decoration:none;font-size:12px}.list{display:grid;gap:10px}.log{border-left:1px solid #47756c;padding:3px 0 3px 12px;color:#c1d2cd;font-size:12px}.log time{display:block;color:var(--muted);font:10px ui-monospace,monospace;margin-bottom:4px}
    .ice-scene{background:linear-gradient(155deg,#b6dece 0,#5f9d9c 21%,#193b54 55%,#071526 100%)}.ice-scene:after{content:"";position:absolute;right:9%;bottom:-29px;width:190px;height:180px;background:linear-gradient(160deg,#eff8e8 0,#b4d9cd 18%,#52849a 72%);clip-path:polygon(42% 0,68% 17%,61% 31%,100% 60%,87% 100%,0 100%,20% 68%,8% 47%);opacity:.9}.ice-scene .scene-title{z-index:2}.ice-scene .scene-tag{z-index:2}
    .clue-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.clue{min-height:112px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:13px;background:#0c1c27;color:var(--text)}.clue.selected{border-color:var(--accent);background:#1a4242}.clue b{display:block;font-size:13px;margin-bottom:5px}.clue span{font-size:11px;color:var(--muted)}.signal{display:flex;align-items:center;gap:6px;height:46px;margin:8px 0}.signal i{display:block;width:9px;background:var(--accent);border-radius:3px;animation:pulse 1s infinite alternate}.signal i:nth-child(3n){height:36px}.signal i:nth-child(3n+1){height:17px;animation-delay:.2s}.signal i:nth-child(3n+2){height:26px;animation-delay:.4s}@keyframes pulse{to{opacity:.35;transform:scaleY(.5)}}
    .room{position:relative;height:270px;border-radius:15px;background:linear-gradient(145deg,#15334a,#0c1c2a);border:1px solid var(--line);overflow:hidden}.room:before{content:"";position:absolute;inset:14px;border:1px solid #7ed5cb42;border-radius:12px;background:linear-gradient(90deg,transparent 49.8%,#7ed5cb1b 50%,transparent 50.2%),linear-gradient(transparent 49.8%,#7ed5cb1b 50%,transparent 50.2%);background-size:72px 72px}.room.hc{background:#000;border:2px solid #fff}.room.hc:before{border-color:#fff;background:linear-gradient(90deg,transparent 49.8%,#fff 50%,transparent 50.2%),linear-gradient(transparent 49.8%,#fff 50%,transparent 50.2%);background-size:72px 72px}.room.large{font-size:18px}.room-label{position:absolute;color:#a6bdb9;font:10px ui-monospace,monospace}.rover{position:absolute;width:32px;height:32px;border:3px solid #07131d;border-radius:50%;background:var(--accent);box-shadow:0 0 22px var(--accent);transform:translate(-50%,-50%);transition:left .25s,top .25s}.station{position:absolute;padding:5px 8px;border-radius:8px;background:#d6c17a;color:#182327;font-size:9px}.dpad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(2,38px);gap:4px}.dpad button{padding:4px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.state-line{font-size:12px;color:var(--muted)}.controlset{display:flex;gap:7px;flex-wrap:wrap}
    .archive-art{width:100%;height:auto;display:block;border-radius:13px;border:1px solid var(--line);background:#172b35}.story-card{padding:14px;border-radius:13px;background:#091923;border:1px solid var(--line);color:#d5e2db;font:15px/1.6 Georgia,"Microsoft YaHei",serif}.story-card em{display:block;color:var(--muted);font:10px ui-monospace,monospace;letter-spacing:.1em;margin-bottom:8px}.stage{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.stage .active{color:var(--accent);border-color:var(--accent);background:#133735}
    .chatlog{height:252px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:#091923;border-radius:13px;border:1px solid var(--line)}.bubble{max-width:92%;padding:11px 13px;border-radius:13px;font-size:12px}.bubble.assistant{background:#162f3c;align-self:flex-start}.bubble.user{background:#22504d;align-self:flex-end}.bubble a{font-size:10px}.askrow{display:flex;gap:8px;margin-top:9px}.askrow input{flex:1;min-width:0}.field{border:1px solid var(--line);background:#0b1b26;color:var(--text);padding:10px 12px;border-radius:10px;font-size:12px}.preset{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.quiz-answer{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#0a1923;color:var(--text);font-size:11px}
    .rolecard{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:13px;background:#091923}.avatar{width:50px;height:66px;border-radius:15px;background:linear-gradient(160deg,#9cceb8 0 20%,#294964 21% 78%,#e6b971 79%);position:relative}.avatar:before{content:"";position:absolute;width:29px;height:29px;border-radius:50%;background:#efc8a0;left:10px;top:8px}.avatar:after{content:"";position:absolute;width:11px;height:11px;border-radius:50%;border:2px solid #f6e5bd;left:19px;top:39px}.shotrow{display:grid;grid-template-columns:minmax(100px,1fr) 1fr 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.shotrow:last-child{border:0}.shotrow label{font-size:11px;color:var(--muted)}.shotrow select{width:100%;min-width:0}.shotstatus{font-size:10px;color:var(--good)}.shotstatus.flag{color:var(--bad)}.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.thumb{width:83px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}.footer{border-top:1px solid var(--line);padding-top:17px;margin-top:24px;color:#839b9a;font-size:10px;display:flex;justify-content:space-between;gap:10px}
    @media(max-width:760px){.layout{grid-template-columns:1fr}.phead{align-items:start}.indexmark{min-width:50px}.indexmark b{font-size:23px}.room{height:240px}}@media(max-width:530px){.wrap{padding-top:20px}.phead{flex-direction:column}.indexmark{display:flex;gap:8px;align-items:center}.indexmark b{font-size:18px}.metric-grid{grid-template-columns:1fr}.metric{display:grid;grid-template-columns:1fr auto;align-items:center}.meter{grid-column:1/-1}.panel{padding:15px}.clue-grid{grid-template-columns:1fr}.shotrow{grid-template-columns:1fr 1fr}.shotrow>strong{grid-column:1/-1}.scene{min-height:220px}.footer{flex-direction:column}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html">FUTURE FIELDNOTES / 2026</a><a class="back" href="index.html">返回珊瑚原型首页</a></header>
  <main id="app" class="wrap" aria-live="polite"></main>
  <script>
    const $ = (s,root=document) => root.querySelector(s);
    const $$ = (s,root=document) => Array.from(root.querySelectorAll(s));
    const app = $('#app');
    const world = 'star';
    const meta = {
      ice:{n:'02',track:'科幻主题沉浸式文旅与教育',title:'冰芯来信：南极科研站 72 小时',intro:'暴风雪切断补给后，你需要在 72 小时内保护冰芯样本、恢复通信，并为科研站做出取舍。每个选择都改变资源状态与结局。',accent:'#a8e9df',label:'ICE CORE / 72 HOURS'},
      moon:{n:'03',track:'跨媒体科幻叙事',title:'月背电台：失联者日志',intro:'月背科研站失联。你收到残缺电台讯号，必须把记录时间、继电器日志和一段重复音调拼成一条可信时间线。',accent:'#e4c58e',label:'FAR SIDE / LAST SIGNAL'},
      sync:{n:'04',track:'元宇宙技术创新与科幻应用',title:'同频舱：无障碍元宇宙交互系统',intro:'同一座未来研究站，支持键盘、方向按钮和预设语音指令。试着用适合自己的方式完成导航，并调整字号、对比度与动效。',accent:'#83dfd0',label:'SYNC DECK / ACCESS FOR ALL'},
      archive:{n:'05',track:'人工智能生成艺术与数字内容创作',title:'声纹织村：口述史共创视觉档案',intro:'从故事底稿选择主题与风格，生成一张程序化视觉草图，再由创作者进行人工修订。示例文案为虚构占位，不代表真实采访。',accent:'#f2be82',label:'VOICE THREAD / CO-CREATE'},
      star:{n:'06',track:'AIGC 智能助手与交互体验设计',title:'星问：带证据链的天文导览伙伴',intro:'选择一个观星问题，让导览助手给出解释和来源。当前页面使用离线示例问答演示交互与证据链，不连接在线 AI 服务。',accent:'#b2c6ff',label:'STELLAR GUIDE / SHOW THE SOURCE'},
      mirror:{n:'07',track:'AIGC 工具、模型应用及可用性评估',title:'镜间：AIGC 短片角色一致性助手',intro:'设定角色卡后，逐镜填写服装颜色与标志物。工具按标签提示差异，由创作者复核并导出记录；不会自动识别画面内容。',accent:'#8fc9f5',label:'FRAME CHECK / HUMAN REVIEW'}
    };
    const info = meta[world] || meta.ice;
    document.documentElement.style.setProperty('--accent',info.accent);
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function header(side){
      document.title = info.title + '｜互动原型';
      return '<section class="phead"><div><div class="eyebrow">'+info.track+'</div><h1>'+info.title+'</h1><p>'+info.intro+'</p></div><div class="indexmark"><b>'+info.n+'</b>'+info.label+'</div></section>';
    }
    function footer(note){
      return '<div class="footer"><span>INTERACTIVE PROTOTYPE · '+info.n+'/07</span><span>'+note+'</span></div>';
    }
    function setPage(main,side,note){
      app.innerHTML = header()+'<div class="layout"><section>'+main+'</section><aside class="list">'+side+'</aside></div>'+footer(note);
    }
    function metric(label,value){
      return '<div class="metric"><label>'+label+'</label><strong>'+Math.round(value)+'</strong><div class="meter"><i style="width:'+Math.max(0,Math.min(100,value))+'%"></i></div></div>';
    }

    // 02 · Ice station: three decisions alter a clearly fictional scenario.
    const ice = {step:0,power:68,safety:58,science:42,log:[]};
    const iceSteps = [
      {title:'第一夜 · 暴风雪抵达',text:'外部风速持续升高，实验室温控和中继天线同时报警。你先处理哪一项？',choices:[
        {name:'为样本舱供暖',detail:'保护冰芯，耗用备用电量。',d:{power:-22,safety:10,science:12}},
        {name:'重启中继天线',detail:'尝试联系补给船，暂缓实验室供电。',d:{power:-14,safety:-4,science:5}},
        {name:'加固外部保温层',detail:'降低后续热损失，但无法立即恢复通信。',d:{power:-18,safety:13,science:0}}
      ]},
      {title:'第二天 · 数据出现异常',text:'冰芯分析仪读数跳变。你只有一组备用耗材，是否立即复测？',choices:[
        {name:'立即复测关键层位',detail:'消耗耗材，增加数据可信度。',d:{power:-12,safety:0,science:22}},
        {name:'先检查仪器校准',detail:'保留耗材，延缓结论。',d:{power:-6,safety:2,science:12}},
        {name:'用历史基线补齐',detail:'节省资源，但把不确定性留给报告。',d:{power:2,safety:0,science:3}}
      ]},
      {title:'第三天 · 最后的通信窗口',text:'风速短暂下降，天线只能保持稳定十分钟。你准备发送什么？',choices:[
        {name:'发送求援坐标与人员状态',detail:'优先确保团队安全。',d:{power:-10,safety:20,science:0}},
        {name:'发送样本与数据清单',detail:'争取科研信息安全传回。',d:{power:-8,safety:5,science:13}},
        {name:'两组信息压缩后同时发送',detail:'高风险操作，可能造成丢包。',d:{power:-18,safety:9,science:9}}
      ]}
    ];
    function renderIce(){
      const s = iceSteps[ice.step];
      if(!s){renderIceEnd();return}
      let choices = s.choices.map((c,i)=>'<button class="btn choice" data-ice="'+i+'"><span>'+c.name+'<small>'+c.detail+'</small></span><b>＋</b></button>').join('');
      const main = '<div class="panel"><div class="metric-grid">'+metric('备用电量',ice.power)+metric('人员安全',ice.safety)+metric('数据完整度',ice.science)+'</div><div class="scene ice-scene"><span class="scene-tag">ANTARCTIC STATION · '+(ice.step+1)+'/3</span><div><div class="scene-title">'+s.title+'</div><div class="small">'+s.text+'</div></div></div><div class="choice-grid">'+choices+'</div></div>';
      const side = '<div class="panel"><div class="kicker">Mission log</div><h2>站点记录</h2><div class="list">'+(ice.log.length?ice.log.map((x,i)=>'<div class="log"><time>DECISION 0'+(i+1)+'</time>'+x+'</div>').join(''):'<div class="small">等待你的第一项决策。选择会改变演示用的资源指标。</div>')+'</div><div class="callout">情景、资源数值与后果均为互动叙事模拟，不是南极站运营建议。</div></div>';
      setPage(main,side,'科幻剧情与资源状态为演示模拟');
      $$('[data-ice]').forEach(b=>b.onclick=()=>{const c=s.choices[Number(b.dataset.ice)];ice.power=Math.max(0,Math.min(100,ice.power+c.d.power));ice.safety=Math.max(0,Math.min(100,ice.safety+c.d.safety));ice.science=Math.max(0,Math.min(100,ice.science+c.d.science));ice.log.push(c.name);ice.step++;renderIce()});
    }
    function renderIceEnd(){
      const total=ice.safety+ice.science+ice.power;
      const ending=total>185?'协同守望：人员安全与关键数据都得到保留。':total>135?'带着缺口返回：团队安全，但部分样本或通信数据需要后续复核。':'优先撤离：团队平安离站，科研数据留待下一次任务。';
      const main='<div class="panel"><div class="kicker">72 hours later</div><h2>'+ending+'</h2><p class="small">你做出的选择：'+ice.log.join(' → ')+'</p><div class="metric-grid">'+metric('剩余电量',ice.power)+metric('人员安全',ice.safety)+metric('数据完整度',ice.science)+'</div><div class="callout">结局按本页面的虚构规则生成，用于展示“选择—反馈”闭环。真实科研与安全决策必须依据专业规范和现场数据。</div><button class="btn primary" data-ice-reset>重新执行任务</button></div>';
      const side='<div class="panel"><div class="kicker">Debrief</div><h2>复盘提示</h2><div class="list"><div class="log">哪些选择保护了团队，哪些选择保护了样本？</div><div class="log">科学任务中的不确定性如何向公众表达？</div><div class="log">演示时可记录不同路线的选择分布与理解度。</div></div></div>';
      setPage(main,side,'剧情为原创虚构设定；数值只用于交互演示');
      $('[data-ice-reset]').onclick=()=>{ice.step=0;ice.power=68;ice.safety=58;ice.science=42;ice.log=[];renderIce()};
    }

    // 03 · Transmedia mystery: choose evidence, then rebuild the signal.
    const moon = {picked:new Set(),done:false};
    const clues = [
      {id:'clock',name:'任务日志 / 22:14',text:'失联前最后一条人工记录时间为 22:14。'},
      {id:'relay',name:'电力台账 / 继电器 B',text:'22:12 时，B 继电器被手动切换到备用阵列。'},
      {id:'tone',name:'电台波形 / 三短一长',text:'讯号尾部反复出现三短一长的节奏。'},
      {id:'diary',name:'值班员便笺 / “别关掉…”',text:'便笺只留下半句，无法单独确认对象。'}
    ];
    function playSignal(){
      const Ctx=window.AudioContext||window.webkitAudioContext;
      if(!Ctx){$('#audioStatus').textContent='当前浏览器不支持合成提示音，波形字幕仍可查看。';return}
      const ctx=new Ctx(), now=ctx.currentTime, osc=ctx.createOscillator(), gain=ctx.createGain();
      osc.type='sine';osc.frequency.value=640;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.12,now+.03);gain.gain.exponentialRampToValueAtTime(.0001,now+.17);osc.connect(gain);gain.connect(ctx.destination);
      for(let i=0;i<4;i++){const t=now+i*.24;osc.frequency.setValueAtTime(i===3?880:520,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.1,t+.02);gain.gain.exponentialRampToValueAtTime(.0001,t+(i===3?.34:.12))}

      const side='<div class="panel"><div class="kicker">Human review queue</div><h2>复核建议</h2><div class="list"><div class="log">对照角色标准卡，确认服装颜色与标志物。</div><div class="log">有差异的镜头可调整标签或标记“人工复核通过”。</div><div class="log">导出报告可用于记录问题、判断与修订负责人。</div></div><div class="callout">规则辅助不等于自动视觉识别。正式开发可再接入图像模型，并用人工标注集测量漏检与误报。</div><div class="rule"></div><div class="kicker">角色一致性</div><p class="small">本次演示：'+mirror.shots.length+' 个镜头 / '+count+' 个标签差异待复核。</p></div>';
      setPage(main,side,'差异来自手动标注；不上传素材，不做自动识别');
      $$('[data-shot]').forEach(sel=>sel.onchange=()=>{const i=Number(sel.dataset.shot);mirror.shots[i][sel.dataset.key]=sel.value;mirror.reviewed.delete(i);renderMirror()});
      $('[data-add-shot]').onclick=()=>{mirror.shots.push({name:'镜头 '+String(mirror.shots.length+1).padStart(2,'0')+' · 新增',coat:'未标注',mark:'未标注'});renderMirror()};
      $('[data-export]').onclick=exportMirror;
      $('#imageFiles').onchange=e=>{mirror.files.forEach(f=>URL.revokeObjectURL(f.url));mirror.files=Array.from(e.target.files).filter(f=>f.type.startsWith('image/')).map(f=>({name:f.name,url:URL.createObjectURL(f)}));renderMirror()};
      $$('.shotrow').forEach((r,i)=>{if(diffFor(mirror.shots[i]).length&&!mirror.reviewed.has(i)){const b=document.createElement('button');b.className='btn smallbtn';b.textContent='标记已复核';b.onclick=()=>{mirror.reviewed.add(i);renderMirror()};r.appendChild(b)}});
    }
    function exportMirror(){
      const lines=['镜间角色一致性复核报告','角色：林澈','标准：服装='+mirror.profile.coat+'；标志物='+mirror.profile.mark,''];
      mirror.shots.forEach((s,i)=>lines.push(s.name+' | 服装='+s.coat+' | 标志物='+s.mark+' | '+(mirror.reviewed.has(i)?'人工复核通过':diffFor(s).length?'差异：'+diffFor(s).join('、'):'一致')));
      const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='镜间-角色一致性复核报告.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    }

    if(world==='ice')renderIce();
    else if(world==='moon')renderMoon();
    else if(world==='sync')renderSync();
    else if(world==='archive')renderArchive();
    else if(world==='star')paintStar();
    else if(world==='mirror')renderMirror();
    else renderIce();
  </script>
</body>
</html>
